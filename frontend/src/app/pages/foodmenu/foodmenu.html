<div class="foodmenu-container">

    <h2>Food Menu</h2>

    <div class="food-grid">

        <div class="food-card" *ngFor="let food of foods">

            <img
                *ngIf="food.image"
                [src]="food.image"
                [alt]="food.name"
            >

            <div class="food-content">

                <h3>{{ food.name }}</h3>

                <p>{{ food.description }}</p>

                <p>Category: {{ food.category }}</p>

                <h4>₹{{ food.price }}</h4>

                <button>Add to Cart</button>

            </div>

        </div>

    </div>

</div>
