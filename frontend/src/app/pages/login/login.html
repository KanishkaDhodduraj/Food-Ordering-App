<div class="auth-container">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p>Login to your Foodie account.</p>

        <form (ngSubmit)="login()">
            <input
                type="email"
                placeholder="Email"
                [(ngModel)]="email"
                name="email"
                required
            >

            <input
                type="password"
                placeholder="Password"
                [(ngModel)]="password"
                name="password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <p class="message">{{ message }}</p>

        <p>
            Don't have an account?
            <a routerLink="/register">Register</a>
        </p>
    </div>
</div>
